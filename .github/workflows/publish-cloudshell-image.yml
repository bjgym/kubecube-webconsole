name: publish-cloudshell-image

on:
  push:
    branches: [main]
    paths:
      - 'cloudshell/**'
      - '.github/workflows/publish-cloudshell-image.yml'
  pull_request:
    paths:
      - 'cloudshell/**'
      - '.github/workflows/publish-cloudshell-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cloudshell-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: cloudshell
          file: cloudshell/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            KUBECTL_VERSION=v1.28.15
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubecube-cloudshell:latest
            ghcr.io/${{ github.repository_owner }}/kubecube-cloudshell:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
